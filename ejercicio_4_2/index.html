<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <!-- So the web is responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title for the internet tab and the search engines -->
  <title>My first English web page-Boilerplate</title>
  <!-- El estilo de mi página -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Description of the web page for search engines -->
  <meta name="My best English web" content="On this page you can learn English in a fun way">
  <!-- Keyword for search engines (nowadays almost obsolete) -->
  <meta name="keywords" content="English, learn, teacher">
  <!-- The author of the web page -->
  <meta name="Autor" content="Gudrun Helga">

  <!-- Favicon of the web -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- For some mobile engines -->
  <meta name="theme-color" content="#fafafa">
</head>

<body>
  <!-- El título de mi página web -->
  <h1>This is my first English web page.</h1>

</html>
