<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Examples seen in class 8: Tables in HTML</h1>
      <p><a href="index.html">Back to home page.</a></p>
      <hr />
    </header>

    <main>
      <h1>Example of a simple table 3</h1>
      <h2>Sales analysis</h2>

      <table border="1">
        <caption>
          Annual sales analysis
        </caption>
        <tr>
          <th>YEAR</th>
          <th>PRODUCT A</th>
          <th>PRODUCT B</th>
          <th>PRODUCT C</th>
          <th>PRODUCT D</th>
        </tr>

        <tr>
          <th>N-3</th>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
        </tr>

        <tr>
          <th>N-2</th>
          <td>3</td>
          <td>5</td>
          <td>8</td>
          <td>4</td>
        </tr>

        <tr>
          <th>N-1</th>
          <td>4</td>
          <td>4</td>
          <td>7</td>
          <td>3</td>
        </tr>

        <tr>
          <th>N</th>
          <td>5</td>
          <td>7</td>
          <td>6</td>
          <td>2</td>
        </tr>
      </table>
    </main>
  </body>
</html>
