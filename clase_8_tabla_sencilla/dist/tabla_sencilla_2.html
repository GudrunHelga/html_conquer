<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Examples seen in class 8: Tables in HTML</h1>
      <p><a href="index.html">Back to home page.</a></p>
      <hr />
    </header>

    <main>
      <h1>Example of a simple table 2</h1>
      <h2>Your order</h2>
      <table border="1">
        <tr>
          <th>Product name</th>
          <th>Unit price</th>
          <th>Units</th>
          <th>Total</th>
        </tr>

        <tr>
          <td>MP3 Player (80 GB)</td>
          <td>195.10</td>
          <td>1</td>
          <td>195.10</td>
        </tr>

        <tr>
          <td>Colored covers</td>
          <td>2.00</td>
          <td>5</td>
          <td>10.00</td>
        </tr>
        <tr>
          <td>Radio and Remote Control</td>
          <td>11.00</td>
          <td>1</td>
          <td>11.00</td>
        </tr>
        <tr>
          <th>TOTAL</th>
          <th>-</th>
          <th>7</th>
          <th>206.10</th>
        </tr>
      </table>
    </main>
  </body>
</html>
